name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build API
        run: |
          dotnet restore src/WebApi/WebApi.csproj
          dotnet build src/WebApi/WebApi.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test --configuration Release --no-build
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            apps/storefront/package-lock.json
            apps/admin/package-lock.json

      - name: Build storefront
        working-directory: apps/storefront
        run: |
          npm ci
          npm run build

      - name: Build admin
        working-directory: apps/admin
        run: |
          npm ci
          npm run build

      - name: Build API Docker image
        run: docker build -f deploy/Dockerfile.api -t rouhani-api .

      - name: Build storefront Docker image
        run: docker build -f deploy/Dockerfile.frontend --build-arg NEXT_APP=storefront -t rouhani-storefront .

      - name: Build admin Docker image
        run: docker build -f deploy/Dockerfile.frontend --build-arg NEXT_APP=admin -t rouhani-admin .